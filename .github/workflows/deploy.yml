name: Deploy

# CI 가 main 에서 통과한 커밋만 서버(mini)의 셀프호스티드 러너가 배포한다.
# 저장소 변수 CD_ENABLED=true 가 아니면 건너뛴다 (러너를 등록하기 전에 작업이 대기열에 쌓이지 않게).
# 공개 저장소이므로 pull_request 에는 절대 반응하지 않는다.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: menu-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build image and swap container on the server
    if: >-
      vars.CD_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'))
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: scripts/deploy-on-server.sh
